function renderSheet(){let d=quiz(state.quiz),peer=state.peer,paired=!!(peer&&peer.id===d.id),n=d.items.length;let matches=paired?state.answers.filter((a,i)=>a===peer.a[i]).length:0;let filter=document.getElementById('diffOnly');let onlyDiff=!!(filter&&filter.checked);let rows=d.items.map((_,i)=>{let same=paired&&state.answers[i]===peer.a[i];if(onlyDiff&&same)return '';return `<div class="sheet-row"><div class="sheet-q">${String(i+1).padStart(2,'0')}. ${escapeHtml(itemText(d,i))} ${paired?`<span class="sheet-mark ${same?'match':'diff'}">${same?'♥ 一致':'✦ ちがう'}</span>`:''}</div>${paired?`<div class="sheet-pair"><div><div class="sheet-col-label" style="color:#bf5b82">🩷 あなた</div><div class="sheet-ans mine">${escapeHtml(optsFor(d,i)[state.answers[i]])}</div></div><div><div class="sheet-col-label" style="color:#577eb2">💙 恋人</div><div class="sheet-ans theirs">${escapeHtml(optsFor(d,i)[peer.a[i]])}</div></div></div>`:`<div class="sheet-ans mine">♡ ${escapeHtml(optsFor(d,i)[state.answers[i]])}</div>`}</div>`}).join('');document.getElementById('sheetMount').innerHTML=`<section class="sheet"><div class="sheet-brand">ふたりの本音 ♡</div><h2>${d.emoji} ${paired?'ふたりの':''}${escapeHtml(d.title)}シート</h2><p class="sheet-sub">${paired?'ふたりの違いも、ふたりらしさ ♡':'あなたの恋愛の本音をチェック ♡'}</p>${paired?`<div class="sheet-score"><span class="muted">ふたりの回答一致率</span><br><b>${Math.round(matches/n*100)}%</b><br><span class="muted">${n}問中 ${matches}問が一致</span></div>`:`<div class="sheet-score"><span class="muted">全${n}問 回答完了 ♡</span><br><strong style="color:#d94d80">MY ANSWER SHEET</strong></div>`}${rows}<div class="sheet-footer">♡ ふたりの本音 ♡</div></section>`}

async function loadSheetCapture(){
 if(window.html2canvas)return;
 await new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  script.onload=resolve;script.onerror=()=>reject(new Error('画像変換ライブラリを読み込めませんでした'));
  document.head.appendChild(script);
 });
}
async function saveSheetImage(event){
 const sheet=document.querySelector('#sheetMount .sheet');
 if(!sheet){alert('結果シートが見つかりません');return}
 const btn=event?.currentTarget;
 if(btn){btn.disabled=true;btn.textContent='⏳ 画像を作成中…'}
 try{
  await loadSheetCapture();
  // 比較表示中も、自分の回答だけを保存する。15問ずつ2列。
  const d=quiz(state.quiz), n=d.items.length, split=Math.ceil(n/2);
  // 保存画像は自分の回答のみ。15問ずつ2列で質問文と回答文を表示。
  const makeColumn=(from,to)=>`<div class="export-column">
    ${d.items.slice(from,to).map((_,j)=>{
      const i=from+j;
      return `<div class="export-text-row">
        <div class="export-text-question"><span class="export-text-num">${String(i+1).padStart(2,'0')}.</span><span>${escapeHtml(itemText(d,i))}</span></div>
        <div class="export-text-answer">♡ ${escapeHtml(optsFor(d,i)[state.answers[i]])}</div>
      </div>`;
    }).join('')}
  </div>`;
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-12000px;top:0;width:1300px;z-index:-1;pointer-events:none';
  const sheetImage=document.createElement('section');
  sheetImage.className='export-sheet';
  sheetImage.innerHTML=`<div class="card-ornaments" aria-hidden="true">
      <span class="ornament ribbon-top">🎀</span><span class="ornament top-heart-a">♡</span><span class="ornament top-heart-b">♡</span><span class="ornament top-heart-c">♥</span>
      <span class="ornament left-heart">♡</span><span class="ornament right-heart">♡</span>
      <span class="ornament flowers-left">💐</span><span class="ornament flowers-right">💐</span>
      <span class="ornament bottom-heart-a">♡</span><span class="ornament bottom-heart-b">♥</span><span class="ornament bottom-heart-c">♡</span>
      <span class="ornament ribbon-bottom">🎀</span>
    </div>
    <div class="export-kicker">Couple Quiz · MY ANSWER SHEET</div>
    <h2>ふたりの本音 <span>♡</span></h2>
    <p class="export-sub">${d.emoji} ${escapeHtml(d.title)}　／　全${n}問の回答</p>
    <div class="export-text-banner">♡ あなたの本音を、ひとつずつ ♡</div>
    <div class="export-columns">${makeColumn(0,split)}${makeColumn(split,n)}</div>
    <div class="export-footer"><span>♡</span>　ふたりの本音　<span>♡</span><small>FUTARI NO HONNE</small></div>`;
  holder.appendChild(sheetImage);document.body.appendChild(holder);
  let canvas;
  try{canvas=await html2canvas(sheetImage,{backgroundColor:'#fff7fa',scale:2,useCORS:true,logging:false,windowWidth:1400,scrollX:0,scrollY:0})}
  finally{holder.remove()}
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw new Error('PNG画像の作成に失敗しました');
  const filename='ふたりの本音_'+quiz(state.quiz).title+'_自分の回答シート.png';
  const file=new File([blob],filename,{type:'image/png'});
  if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'ふたりの本音 ♡ 結果シート'});return}
   catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  alert('画像を保存したよ！保存できない場合は共有メニューから「画像を保存」を選んでね。');
 }catch(e){alert('画像を作れませんでした。通信環境を確認してもう一度試してね。\n'+e.message)}
 finally{if(btn){btn.disabled=false;btn.textContent='🖼️ 自分の回答を画像保存'}}
}
async function copyLink(){let u=urlFor(state.quiz,state.answers);try{await navigator.clipboard.writeText(u);alert('リンクをコピーしたよ！LINEに貼り付けてね ♡')}catch{prompt('このリンクをコピーしてね',u)}}
function copySummary(){let d=quiz(state.quiz);let summary=`${d.title} ♡\n`+d.items.map((_,i)=>`${i+1}. ${itemText(d,i)}：${optsFor(d,i)[state.answers[i]]}`).join('\n');if(state.peer&&state.peer.id===d.id)summary+=`\n\n一致率：${Math.round(state.answers.filter((v,i)=>v===state.peer.a[i]).length/d.items.length*100)}%`;navigator.clipboard?.writeText(summary).then(()=>alert('結果をコピーしたよ！')).catch(()=>prompt('結果をコピーしてね',summary))||(!navigator.clipboard&&prompt('結果をコピーしてね',summary))}
async function shareNative(){let u=urlFor(state.quiz,state.answers);if(navigator.share){try{await navigator.share({title:'ふたりの本音 ♡',text:`「${quiz(state.quiz).title}」一緒にやろう！`,url:u})}catch(e){}}else copyLink()}
function share(){let u=urlFor(state.quiz,state.answers);let msg=`「${quiz(state.quiz).title}」やってみたよ！💕\nこのリンクから回答して比べよう！\n${u}`;window.open('https://line.me/R/msg/text/?'+encodeURIComponent(msg),'_blank','noopener')}
function boot(){let m=location.hash.match(/^#share=(.+)$/);if(m){let peer=unpack(decodeURIComponent(m[1]));if(peer){state.quiz=peer.id;state.peer=peer;state.page='invite';render();return}}home()}window.addEventListener('hashchange',boot);boot();
</script></body></html>
