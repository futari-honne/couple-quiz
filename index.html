let complete=state.answers.length===n&&state.answers.every(Number.isInteger);if(!complete){state.page='play';render();return}let peer=state.peer,validPeer=peer&&peer.id===d.id;let matches=validPeer?state.answers.filter((v,i)=>v===peer.a[i]).length:0;app.innerHTML=`<button class="back" onclick="home()">← 診断一覧へ</button><div class="panel center"><div class="heart">${d.emoji} 💗</div><h2>${escapeHtml(d.title)} 完了！</h2><p class="muted">${validPeer?'ふたりの本音を見比べよう♡':'あなたの本音シートが完成したよ♡'}</p><div class="sheet-actions"><button class="btn line" onclick="share()">💚 LINEで共有</button><button class="btn secondary" onclick="copyLink()">🔗 リンクをコピー</button><button class="btn secondary" onclick="shareNative()">📤 その他で共有</button><button class="btn secondary" onclick="state.index=0;state.page='play';render()">✏️ 回答を修正</button></div></div>${validPeer?'<label class="sheet-filter"><input id="diffOnly" type="checkbox" onchange="renderSheet()"> 回答が違う質問だけ表示</label>':''}<div id="sheetMount"></div><div class="panel center"><p class="muted">シートをスクリーンショットで保存できるよ♡<br>恋人に送るリンクには、あなたの回答が含まれます。</p><div class="sheet-actions"><button class="btn secondary" onclick="copySummary()">📋 回答を文字でコピー</button><button class="btn secondary" onclick="window.print()">🖨️ 印刷・PDF保存</button></div></div><p class="note">一致率は相性の良し悪しを表すものではありません。<br>リンクを知っている人は回答を確認できるため、共有先に気をつけてね。</p>`;renderSheet()}
function renderSheet(){let d=quiz(state.quiz),peer=state.peer,paired=!!(peer&&peer.id===d.id),n=d.items.length;let matches=paired?state.answers.filter((a,i)=>a===peer.a[i]).length:0;let filter=document.getElementById('diffOnly');let onlyDiff=!!(filter&&filter.checked);let rows=d.items.map((_,i)=>{let same=paired&&state.answers[i]===peer.a[i];if(onlyDiff&&same)return '';return `<div class="sheet-row"><div class="sheet-q">${String(i+1).padStart(2,'0')}. ${escapeHtml(itemText(d,i))} ${paired?`<span class="sheet-mark ${same?'match':'diff'}">${same?'♥ 一致':'✦ ちがう'}</span>`:''}</div>${paired?`<div class="sheet-pair"><div><div class="sheet-col-label" style="color:#bf5b82">🩷 あなた</div><div class="sheet-ans mine">${escapeHtml(optsFor(d,i)[state.answers[i]])}</div></div><div><div class="sheet-col-label" style="color:#577eb2">💙 恋人</div><div class="sheet-ans theirs">${escapeHtml(optsFor(d,i)[peer.a[i]])}</div></div></div>`:`<div class="sheet-ans mine">♡ ${escapeHtml(optsFor(d,i)[state.answers[i]])}</div>`}</div>`}).join('');document.getElementById('sheetMount').innerHTML=`<section class="sheet"><div class="sheet-brand">ふたりの本音 ♡</div><h2>${d.emoji} ${paired?'ふたりの':''}${escapeHtml(d.title)}シート</h2><p class="sheet-sub">${paired?'ふたりの違いも、ふたりらしさ ♡':'あなたの恋愛の本音をチェック ♡'}</p>${paired?`<div class="sheet-score"><span class="muted">ふたりの回答一致率</span><br><b>${Math.round(matches/n*100)}%</b><br><span class="muted">${n}問中 ${matches}問が一致</span></div>`:`<div class="sheet-score"><span class="muted">全${n}問 回答完了 ♡</span><br><strong style="color:#d94d80">MY ANSWER SHEET</strong></div>`}${rows}<div class="sheet-footer">♡ ふたりの本音 ♡</div></section>`}

async function copyLink(){let u=urlFor(state.quiz,state.answers);try{await navigator.clipboard.writeText(u);alert('リンクをコピーしたよ！LINEに貼り付けてね ♡')}catch{prompt('このリンクをコピーしてね',u)}}
function copySummary(){let d=quiz(state.quiz);let summary=`${d.title} ♡\n`+d.items.map((_,i)=>`${i+1}. ${itemText(d,i)}：${optsFor(d,i)[state.answers[i]]}`).join('\n');if(state.peer&&state.peer.id===d.id)summary+=`\n\n一致率：${Math.round(state.answers.filter((v,i)=>v===state.peer.a[i]).length/d.items.length*100)}%`;navigator.clipboard?.writeText(summary).then(()=>alert('結果をコピーしたよ！')).catch(()=>prompt('結果をコピーしてね',summary))||(!navigator.clipboard&&prompt('結果をコピーしてね',summary))}
async function shareNative(){let u=urlFor(state.quiz,state.answers);if(navigator.share){try{await navigator.share({title:'ふたりの本音 ♡',text:`「${quiz(state.quiz).title}」一緒にやろう！`,url:u})}catch(e){}}else copyLink()}
function share(){let u=urlFor(state.quiz,state.answers);let msg=`「${quiz(state.quiz).title}」やってみたよ！💕\nこのリンクから回答して比べよう！\n${u}`;window.open('https://line.me/R/msg/text/?'+encodeURIComponent(msg),'_blank','noopener')}
function boot(){let m=location.hash.match(/^#share=(.+)$/);if(m){let peer=unpack(decodeURIComponent(m[1]));if(peer){state.quiz=peer.id;state.peer=peer;state.page='invite';render();return}}home()}window.addEventListener('hashchange',boot);boot();
</script></body></html>
