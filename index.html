:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#493543;background:#fff7fa}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:580px;margin:auto;min-height:100dvh;padding:24px 16px 70px}.hero{text-align:center;padding:22px 8px 14px}.hero h1{font-size:30px;color:#e95483;margin:8px 0}.hero p{font-size:13px;color:#967487;line-height:1.7}.heart{font-size:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:0;border-radius:22px;padding:23px 10px;background:var(--bg);text-align:center;box-shadow:0 4px 15px #9d4c7320;color:#493543;min-height:166px}.tile .emoji{font-size:38px}.tile strong{display:block;margin:10px 0 7px;font-size:16px}.tile small{font-size:11px;color:#785e6c}.tile .cta{display:inline-block;background:white;border-radius:20px;color:#c84877;font-size:11px;padding:7px 14px;margin-top:14px}.panel{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 5px 25px #b04b7120;margin:16px 0}.back{border:0;background:none;color:#a04f70;padding:10px 0;font-weight:700}.tag{color:#c75c81;font-size:12px;font-weight:700}.question{font-size:21px;line-height:1.5;margin:15px 0 22px}.options{display:grid;gap:12px}.option{border:2px solid #f1dce5;border-radius:16px;padding:17px 14px;text-align:left;background:#fff;font-weight:700;color:#634b59}.option.selected{border-color:#e85c8e;background:#fff0f6}.progress{height:9px;background:#f9dce7;border-radius:20px;overflow:hidden;margin:18px 0}.progress span{display:block;background:#ee709c;height:100%;transition:width .2s}.actions{display:flex;gap:10px;margin-top:20px}.btn{background:#e95688;color:white;border:0;border-radius:15px;padding:15px 18px;font-weight:700;flex:1}.btn.secondary{background:#f9e7ee;color:#aa5073}.btn:disabled{opacity:.4}.muted{color:#937887;font-size:13px;line-height:1.8}.center{text-align:center}.score{font-size:55px;font-weight:800;color:#e95688;margin:14px}.compare{border-top:1px  .intro{background:linear-gradient(135deg,#fff0f6,#fff9e9);padding:16px;border-radius:18px;margin:8px 0 18px;text-align:center}.intro b{color:#b94d79}.sectiontitle{font-size:15px;margin:23px 0 12px}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip{font-size:11px;background:white;border-radius:20px;padding:7px 10px;color:#b14c75}.steps{display:flex;gap:8px;margin:18px 0}.step{flex:1;background:#fff;border-radius:14px;padding:12px 7px;text-align:center;font-size:11px;line-height:1.5}.step b{display:block;color:#df5784;font-size:16px}.footer{font-size:11px;color:#9b798b;text-align:center;line-height:1.8;padding:18px 0}.smallbtn{background:none;border:1px solid #eab9cd;color:#a95073;border-radius:12px;padding:9px 12px;font-size:12px}.tip{background:#fff7eb;border-radius:12px;padding:13px;font-size:12px;line-height:1.7}.shareActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.shareActions button{font-size:13px}.btn.line{background:#06c755}.option:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:3px solid #a74bff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.progress span{transition:none}} </style></head><body><main id="app"></main><script>

{id:'sokubaku',emoji:'🔒',title:'束縛判定',desc:'愛情？それとも束縛？',bg:'#ffebd5',opts:['束縛','ちょっと重い','全然OK'],items:['今どこにいるか毎回聞く','返信が遅い理由を聞く','LINEの既読を気にする','未読が続くと不機嫌になる','電話に出るまで何度もかける','SNSの投稿を毎回チェックする','異性の「いいね」を気にする','スマホのロック番号を知りたがる','スマホを見せてと言う','位置情報を共有したがる','他の異性との連絡を聞く','連絡する頻度を決める','即レスを求める','会えない日はビデオ通話を求める','異性からのDMをやめてと言う','2人の写真をSNSに載せてと言う','飲み会中も連絡を求める','異性との食事を禁止する','友達との時間より自分を優先してと言う','休日の予定を全部知りたがる']},

{id:'ureshii',emoji:'💕',title:'嬉しい判定',desc:'どんな愛情表現が好き？',bg:'#ffe0f0',opts:['すごく嬉しい','普通','ちょっと苦手'],items:['朝に「おはよう」と連絡','仕事終わりに「お疲れさま」','突然会いに来てくれる','頭をなでられる','ぎゅっとハグされる','たくさん褒められる','写真や動画を送ってくれる','手をつないで歩く','さりげないプレゼント','一緒に料理をする','体調を気にかけてくれる','頑張りを褒めてくれる','記念日を覚えてくれる','休日を一緒にのんびり過ごす','寝る前に電話する','手作りのご飯を作ってくれる','デートを計画してくれる','「好き」と言葉で伝える','何気ない時にキスしてくれる','落ち込んだ時にそばにいてくれる']},
{id:'kyorikan',emoji:'🫶',title:'恋人との距離感',desc:'理想の頻度をすり合わせ',bg:'#ddf0ff',opts:['毎日・いつも','たまになら','ほとんど不要'],items:['LINEのやりとり','電話すること','ビデオ通話','デートで会うこと','手をつなぐこと','ハグすること','キスすること','一緒に映画を見ること','一緒にゲームすること','休日を一緒に過ごすこと','朝のおはようLINE','寝る前のおやすみLINE','サプライズすること','写真を送り合うこと','一緒に旅行すること','お互いの友達と会うこと','将来の話をすること','好きと言い合うこと','一人の時間を持つこと','その日の出来事を話すこと']}

const app=document.getElementById('app');let state={page:'home',quiz:null,index:0,answers:[],peer:null};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const storeKey=id=>'futari-v1-'+id;const quiz=id=>defs.find(x=>x.id===id);const itemText=(d,i)=>Array.isArray(d.items[i])?d.items[i][0]:d.items[i];const optsFor=(d,i)=>Array.isArray(d.items[i])?d.items[i].slice(1):d.opts;
function save(){try{localStorage.setItem(storeKey(state.quiz),JSON.stringify(state.answers))}catch(e){}}function load(id){try{let a=JSON.parse(localStorage.getItem(storeKey(id))||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function pack(id,ans){return btoa(JSON.stringify({v:1,id,a:ans})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};function unpack(s){try{let x=JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/')));if(x.v!==1||!quiz(x.id)||!Array.isArray(x.a)||x.a.length!==quiz(x.id).items.length||!x.a.every((v,i)=>Number.isInteger(v)&&v>=0&&v<optsFor(quiz(x.id),i).length))return null;return x}catch{return null}}
function urlFor(id,a){let u=new URL(location.href);u.hash='share='+encodeURIComponent(pack(id,a));return u.toString()}
function home(){state.page='home';state.peer=null;history.replaceState(null,'',location.pathname+location.search);render()};function start(id,peer=null){state.quiz=id;state.answers=load(id);state.index=Math.max(0,state.answers.findIndex(v=>v===null||v===undefined));if(state.index===0&&state.answers.length===quiz(id).items.length&&state.answers.every(Number.isInteger))state.index=0;state.peer=peer;state.page='play';render()};function answer(n){state.answers[state.index]=n;save();if(state.index<quiz(state.quiz).items.length-1){state.index++;render()}else{state.page='result';render()}}
function result(){if(state.answers.length!==quiz(state.quiz).items.length||!state.answers.every(Number.isInteger)){state.page='play';render();return}state.page='result';render()}
function render(){if(state.page==='home'){app.innerHTML=`<header class="hero"><div class="heart">💗 🐰 💗</div><h1>ふたりの本音 ♡</h1><p>正解はないから、気軽に答えてね。<br>2人の「ちがい」が、もっと仲良くなるきっかけに。</p></header><div class="intro"><b>これってアリ？ナシ？</b><div class="chips"><span class="chip">✓ 無料</span><span class="chip">✓ 登録不要</span><span class="chip">✓ 3択・約3分</span></div></div><h2 class="sectiontitle">💗 遊びたい診断を選ぼう</h2><div class="grid">${defs.map(d=>`<button class="tile" style="--bg:${d.bg}" onclick="start('${d.id}')"><div class="emoji">${d.emoji}</div><strong>${d.title}</strong><small>${d.desc}</small><br><span class="cta">遊んでみる →</span></button>`).join('')}</div><div class="steps"><div class="step"><b>①</b>診断を選ぶ</div><div class="step"><b>②</b>3択で回答</div><div class="step"><b>③</b>LINEで答え合わせ</div></div><p class="footer">回答はこの端末に保存されます。<br>共有URLには回答内容が含まれ、URLを知る人は閲覧できます。<br>© ふたりの本音 ♡ オリジナル診断</p>`;return}
let d=quiz(state.quiz),n=d.items.length;if(state.page==='play'){let i=state.index,opts=optsFor(d,i);app.innerHTML=`<button class="back" onclick="home()">← 診断を選び直す</button><div class="panel"><div class="center"><span class="pill">${d.emoji} ${d.title}</span></div><div class="progress"><span style="width:${Math.round((i+(Number.isInteger(state.answers[i])?1:0))/n*100)}%"></span></div><div class="tag">QUESTION ${i+1} / ${n}</div><h2 class="question">${escapeHtml(itemText(d,i))}</h2><div class="options">${opts.map((o,k)=>`<button class="option ${state.answers[i]===k?'selected':''}" onclick="answer(${k})">${['🩷','💛','💙'][k]}　${escapeHtml(o)}</button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="${i===0?'home()':'state.index--;render()'}">← 戻る</button>${state.answers.every(Number.isInteger)&&state.answers.length===n?'<button class="btn" onclick="result()">結果を見る</button>':''}</div></div><p class="note">相手の答えを予想しながら選んでみてね ♡</p>`;return}
let complete=state.answers.length===n&&state.answers.every(Number.isInteger);if(!complete){state.page='play';render();return}let peer=state.peer,validPeer=peer&&peer.id===d.id;let matches=validPeer?state.answers.filter((v,i)=>v===peer.a[i]).length:0;app.innerHTML=`<button class="back" onclick="home()">← 診断一覧へ</button><div class="panel center"><div class="heart">${d.emoji} 💗</div><h2>${d.title} 完了！</h2>${validPeer?`<div class="muted">2人の回答一致率</div><div class="score">${Math.round(matches/n*100)}%</div><p class="muted">${n}問中${matches}問が一致！<br>違う答えも2人らしさだよ ♡</p>`:`<p class="muted">お疲れさま！彼女にリンクを送って<br>2人の回答を比べてみよう ♡</p>`}<button class="btn line" style="width:100%" onclick="share()">💚 LINEで恋人に送る</button><div class="shareActions"><button class="btn secondary" onclick="copyLink()">🔗 リンクをコピー</button><button class="btn secondary" onclick="shareNative()">📤 その他で共有</button><button class="btn secondary" onclick="copySummary()">📋 結果をコピー</button><button class="btn secondary" onclick="state.index=0;state.page='play';render()">✏️ 回答を修正</button></div></div><div class="tip">💡 答えが違う質問ほど盛り上がる！「どうしてそう思う？」と聞いてみてね。<br>※ 一致率は相性の良し悪しを判定するものではありません。</div><div class="panel"><h3>${validPeer?'2人の回答を比べよう':'あなたの回答一覧'}</h3>${d.items.map((x,i)=>`<div class="compare"><strong>${i+1}. ${escapeHtml(itemText(d,i))}</strong><p>あなた：${escapeHtml(optsFor(d,i)[state.answers[i]])}</p>${validPeer?`<p>相手：${escapeHtml(optsFor(d,i)[peer.a[i]])} <span class="${state.answers[i]===peer.a[i]?'match':'diff'}">${state.answers[i]===peer.a[i]?'♥ 一致':'✦ ちがう'}</span></p>`:''}</div>`).join('')}</div><p class="note">この一致率は相性の良し悪しを示すものではありません。<br>URLを知る人は回答を見られるため、共有先に気をつけてね。</p>`}
async function copyLink(){let u=urlFor(state.quiz,state.answers);try{await navigator.clipboard.writeText(u);alert('リンクをコピーしたよ！LINEに貼り付けてね ♡')}catch{prompt('このリンクをコピーしてね',u)}}
function copySummary(){let d=quiz(state.quiz);let summary=`${d.title} ♡\n`+d.items.map((_,i)=>`${i+1}. ${itemText(d,i)}：${optsFor(d,i)[state.answers[i]]}`).join('\n');if(state.peer&&state.peer.id===d.id)summary+=`\n\n一致率：${Math.round(state.answers.filter((v,i)=>v===state.peer.a[i]).length/d.items.length*100)}%`;navigator.clipboard?.writeText(summary).then(()=>alert('結果をコピーしたよ！')).catch(()=>prompt('結果をコピーしてね',summary))||(!navigator.clipboard&&prompt('結果をコピーしてね',summary))}
async function shareNative(){let u=urlFor(state.quiz,state.answers);if(navigator.share){try{await navigator.share({title:'ふたりの本音 ♡',text:`「${quiz(state.quiz).title}」一緒にやろう！`,url:u})}catch(e){}}else copyLink()}
function share(){let u=urlFor(state.quiz,state.answers);let msg=`「${quiz(state.quiz).title}」やってみたよ！💕\nこのリンクから回答して比べよう！\n${u}`;window.open('https://line.me/R/msg/text/?'+encodeURIComponent(msg),'_blank','noopener')}
function boot(){let m=location.hash.match(/^#share=(.+)$/);if(m){let peer=unpack(decodeURIComponent(m[1]));if(peer){start(peer.id,peer);return}}home()}window.addEventListener('hashchange',boot);boot();
</script></body></html>
